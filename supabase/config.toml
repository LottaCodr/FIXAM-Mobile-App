# Local + linked project config. Secrets live in .env / `supabase secrets`.

project_id = "fixam"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "fixam://auth/callback"
additional_redirect_urls = [
  "fixam://auth/callback",
  "fixam://payment/callback",
  "http://localhost:8081/auth/callback",
  "http://127.0.0.1:8081/auth/callback",
  "exp://127.0.0.1:8081",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"

[auth.external.facebook]
enabled = true
client_id = "env(FACEBOOK_CLIENT_ID)"
secret = "env(FACEBOOK_CLIENT_SECRET)"

[realtime]
enabled = true

[functions.payments-initialize]
verify_jwt = true

[functions.payments-verify]
verify_jwt = true

[functions.payments-webhook]
verify_jwt = false

[functions.payouts-create]
verify_jwt = true

[functions.payouts-webhook]
verify_jwt = false

[functions.banks-list]
verify_jwt = true

[functions.banks-resolve]
verify_jwt = true

[functions.jobs-create]
verify_jwt = true

[functions.jobs-transition]
verify_jwt = true

[functions.referrals-redeem]
verify_jwt = true

[functions.account-delete]
verify_jwt = true
